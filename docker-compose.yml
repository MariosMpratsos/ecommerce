name: ecommerce-shop

services:
  ecommerce-backend:
    image: ${IMAGE_PREFIX:-ghcr.io/mariosmpratsos/ecommerce}-backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - default
      - mhealth

  ecommerce-frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/mariosmpratsos/ecommerce}-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - ecommerce-backend
    networks:
      - default
      - mhealth

networks:
  default:
  mhealth:
    external: true
    name: mhealth_default
