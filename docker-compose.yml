name: ecommerce-shop

services:
  backend:
    image: ghcr.io/mariosmpratsos/ecommerce-backend:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      default: {}
      mhealth:
        aliases:
          - ecommerce-backend

  frontend:
    image: ghcr.io/mariosmpratsos/ecommerce-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      default: {}
      mhealth:
        aliases:
          - ecommerce-frontend

networks:
  default:
  mhealth:
    external: true
    name: mhealth_default
