services:

  backend:
    build: ./server
    container_name: ecommerce-backend
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build: ./client
    container_name: ecommerce-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
