name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  # Allows you to run the workflow manually
  # without creating a new commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ecommerce

jobs:

  # ==========================================
  # CI - TEST
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # Backend
      # ----------------------------------------
      - name: Backend tests
        working-directory: server
        run: |
          echo "Backend directory:"
          pwd
          ls -la

          echo "Run backend tests here"

          # If your backend is Node:
          # npm ci
          # npm test

          # If your backend is Python:
          # pip install -r requirements.txt
          # pytest


      # ----------------------------------------
      # Frontend
      # ----------------------------------------
      # Frontend is in the ROOT of the repository.
      - name: Frontend build
        run: |
          echo "Frontend directory:"
          pwd
          ls -la

          npm ci
          npm run build


  # ==========================================
  # BUILD DOCKER IMAGES
  # ==========================================
  build:
    name: Build Docker Images

    needs: test

    # Only build images on push, not pull requests
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # Build backend
      # ----------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-backend:latest \
            ./server


      # ----------------------------------------
      # Build frontend
      # ----------------------------------------
      # Frontend Dockerfile is in the repository root.
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-frontend:latest \
            .


      # ----------------------------------------
      # Push backend
      # ----------------------------------------
      - name: Push backend image
        run: |
          docker push \
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker push \
            ${{ env.IMAGE_PREFIX }}-backend:latest


      # ----------------------------------------
      # Push frontend
      # ----------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker push \
            ${{ env.IMAGE_PREFIX }}-frontend:latest


  # ==========================================
  # DEPLOY TO VPS
  # ==========================================
  deploy:
    name: Deploy to VPS

    needs: build

    # Only deploy on push to master
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Setup SSH
      # ----------------------------------------
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}


      # ----------------------------------------
      # Trust VPS host
      # ----------------------------------------
      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H 169.58.201.189 >> ~/.ssh/known_hosts


      # ----------------------------------------
      # Deploy
      # ----------------------------------------
      - name: Deploy to VPS
        run: |
          ssh root@169.58.201.189 << 'EOF'

            set -e

            echo "================================"
            echo "Starting deployment"
            echo "================================"

            # Go to project directory
            cd /root/my-project

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin


            echo "Pulling latest Docker images..."

            docker compose pull


            echo "Starting containers..."

            docker compose up -d


            echo "Removing unused Docker images..."

            docker image prune -f


            echo "================================"
            echo "Deployment complete"
            echo "================================"

            echo "Running containers:"

            docker compose ps

          EOF
