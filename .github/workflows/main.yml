name: CI/CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H 169.58.201.189 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh root@169.58.201.189 << 'EOF'
            cd /root/my-project

            git pull origin master

            docker compose down
            docker compose up -d --build
          EOF
