name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/root/ecommerce' }}
  PROXY_CONTAINER: ${{ vars.PROXY_CONTAINER || '' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend build
        run: |
          npm ci
          npm run build

  build:
    name: Build & Push Images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=${{ env.REGISTRY }}/$OWNER/ecommerce" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image (./server/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-backend:latest
            ${{ steps.vars.outputs.image_prefix }}-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image (./Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-frontend:latest
            ${{ steps.vars.outputs.image_prefix }}-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ecommerce
      cancel-in-progress: false
    env:
      IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required config
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::VPS_HOST is empty"; exit 1; }

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Provision server with Ansible
        run: |
          pipx install ansible
          printf '[vps]\nserver ansible_host=%s ansible_user=root ansible_python_interpreter=/usr/bin/python3\n' "$VPS_HOST" > /tmp/inventory.ini
          ansible-playbook -i /tmp/inventory.ini ansible/setup.yml \
            -e deploy_dir="$DEPLOY_DIR" \
            -e proxy_container="$PROXY_CONTAINER"

      - name: Copy docker-compose.yml to server
        run: |
          scp -o BatchMode=yes docker-compose.yml root@"$VPS_HOST":"$DEPLOY_DIR"/docker-compose.yml

      - name: Upload .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::GEMINI_API_KEY missing"; exit 1; }
          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            [ -z "$GEMINI_MODEL" ] || printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL"
          } | ssh -o BatchMode=yes root@"$VPS_HOST" \
            "cat > '$DEPLOY_DIR/.env' && chmod 600 '$DEPLOY_DIR/.env'"

      - name: Log in to GHCR on VPS
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          GHCR_USER_LC=$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
          TOKEN=$(printf '%s' "$GHCR_PAT" | tr -d '[:space:]')
          [ -n "$TOKEN" ] || { echo "::error::GHCR_PAT is empty"; exit 1; }
          printf '%s' "$TOKEN" | ssh -o BatchMode=yes root@"$VPS_HOST" \
            "docker login ghcr.io -u $GHCR_USER_LC --password-stdin" \
            || { echo "::error::GHCR login denied. Use a CLASSIC token with read:packages."; exit 1; }

      - name: Check mhealth network exists
        run: |
          ssh -o BatchMode=yes root@"$VPS_HOST" \
            "docker network inspect mhealth_default >/dev/null" \
            || { echo "::error::Network mhealth_default not found. Deploy the mhealth stack first."; exit 1; }

      - name: Pull & restart
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@"$VPS_HOST" \
            bash -s -- "$DEPLOY_DIR" "$IMAGE_PREFIX" "$TAG" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          export IMAGE_PREFIX="$2" TAG="$3"

          docker compose pull --quiet
          docker compose up -d --force-recreate --remove-orphans
          sleep 8
          docker compose ps

          if [ -n "$(docker compose ps --status exited --status restarting --status dead -q)" ]; then
            echo "ERROR: a container is not running"
            docker compose logs --tail=100
            exit 1
          fi

          docker image prune -f
          REMOTE
