name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mariosmpratsos/ecommerce
  VPS_HOST: 169.58.201.189
  DEPLOY_DIR: /root/ecommerce

jobs:

  # =========================
  # TEST
  # =========================

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend tests
        working-directory: server
        run: |
          echo "Backend directory:"
          pwd
          ls -la
          echo "Running backend tests..."
          # Add your backend tests here, for example:
          # npm ci
          # npm test

      - name: Frontend tests
        run: |
          echo "Frontend directory:"
          pwd
          ls -la
          npm ci
          echo "Building frontend..."
          npm run build


  # =========================
  # BUILD DOCKER IMAGES
  # =========================

  build:
    name: Build Docker Images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-backend:latest \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-frontend:latest \
            .

      - name: Push backend image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Push frontend image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-frontend:latest


  # =========================
  # DEPLOY TO VPS
  # =========================

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Key format OK"
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare server folder and upload compose file
        run: |
          ssh -o BatchMode=yes root@${{ env.VPS_HOST }} "mkdir -p ${{ env.DEPLOY_DIR }}/data"
          scp -o BatchMode=yes docker-compose.yml root@${{ env.VPS_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml

      - name: Upload .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | ssh -o BatchMode=yes root@${{ env.VPS_HOST }} "cat > ${{ env.DEPLOY_DIR }}/.env && chmod 600 ${{ env.DEPLOY_DIR }}/.env"

      - name: Deploy to VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "Logging into GHCR on the server..."
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes root@${{ env.VPS_HOST }} \
            "docker login ghcr.io -u $GHCR_USER --password-stdin"

          ssh -o BatchMode=yes root@${{ env.VPS_HOST }} << 'EOF'
            set -e
            cd /root/ecommerce

            echo "Pulling new images..."
            docker compose pull

            echo "Starting application..."
            docker compose up -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Running containers:"
            docker compose ps

            docker logout ghcr.io
          EOF
