name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mariosmpratsos/ecommerce
  VPS_HOST: 169.58.201.189

jobs:

  # =========================
  # TEST
  # =========================

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend
      - name: Backend tests
        working-directory: server
        run: |
          echo "Backend directory:"
          pwd
          ls -la

          echo "Running backend tests..."
          # Add your backend tests here, for example:
          # npm ci
          # npm test

      # Frontend
      - name: Frontend tests
        run: |
          echo "Frontend directory:"
          pwd
          ls -la

          npm ci

          echo "Building frontend..."
          npm run build


  # =========================
  # BUILD DOCKER IMAGES
  # =========================

  build:
    name: Build Docker Images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-backend:latest \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-frontend:latest \
            .

      - name: Push backend image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Push frontend image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-frontend:latest


  # =========================
  # DEPLOY TO VPS
  # =========================

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes root@${{ env.VPS_HOST }} "echo SSH connection OK"

      - name: Deploy to VPS
        run: |
          ssh -o BatchMode=yes root@${{ env.VPS_HOST }} << 'EOF'

            set -e

            echo "================================"
            echo "Starting deployment"
            echo "================================"

            cd /root/my-project

            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "Pulling new Docker images..."
            docker compose pull

            echo "Starting application..."
            docker compose up -d

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "================================"
            echo "Deployment complete"
            echo "================================"

            docker compose ps

          EOF
