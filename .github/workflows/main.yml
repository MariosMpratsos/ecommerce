name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  VPS_HOST: ${{ vars.VPS_HOST }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/root/ecommerce' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend build
        run: |
          npm ci
          npm run build

  build:
    name: Build & Push Images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=${{ env.REGISTRY }}/$OWNER/ecommerce" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image (./server/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-backend:latest
            ${{ steps.vars.outputs.image_prefix }}-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image (./Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-frontend:latest
            ${{ steps.vars.outputs.image_prefix }}-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to server
        run: |
          ssh -o BatchMode=yes root@"$VPS_HOST" "mkdir -p $DEPLOY_DIR/data"
          scp -o BatchMode=yes docker-compose.yml root@"$VPS_HOST":"$DEPLOY_DIR"/docker-compose.yml

      - name: Upload .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY missing"; exit 1; fi
          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            if [ -n "$GEMINI_MODEL" ]; then printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL"; fi
          } | ssh -o BatchMode=yes root@"$VPS_HOST" \
            "cat > $DEPLOY_DIR/.env && chmod 600 $DEPLOY_DIR/.env"

      - name: Pull & restart
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
        run: |
          printf '%s' "$GHCR_PAT" | ssh -o BatchMode=yes root@"$VPS_HOST" \
            "docker login ghcr.io -u $GHCR_USER --password-stdin"

          ssh -o BatchMode=yes root@"$VPS_HOST" \
            "cd $DEPLOY_DIR && \
             export IMAGE_PREFIX=$IMAGE_PREFIX TAG=${{ github.sha }} && \
             docker compose pull && \
             docker compose up -d --force-recreate --remove-orphans && \
             docker compose ps && \
             docker image prune -f"
