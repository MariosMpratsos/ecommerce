server {
    listen 443 ssl;
    server_name ecommerce.bratsos.online;

    ssl_certificate     /etc/letsencrypt/live/ecommerce.bratsos.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.bratsos.online/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $ecom http://ecommerce:3000;   # container name : its internal port

    location / {
        proxy_pass $ecom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
