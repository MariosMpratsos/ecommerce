events {
    worker_connections 1024;
}

http {

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    upstream grafana_upstream {
        server grafana:3000;
    }

    upstream ecommerce_frontend_upstream {
        server host.docker.internal:8080;
    }

    upstream ecommerce_backend_upstream {
        server host.docker.internal:5001;
    }

    # ---------- mHealth: HTTP ----------
    server {
        listen 80;
        server_name bratsos.online www.bratsos.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- mHealth: HTTPS ----------
    server {
        listen 443 ssl http2;
        server_name bratsos.online www.bratsos.online;

        ssl_certificate     /etc/letsencrypt/live/bratsos.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bratsos.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 25M;

        location ~ ^/(api|admin)/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /metrics {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /grafana/ {
            proxy_pass http://grafana_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------- E-commerce: HTTP ----------
    server {
        listen 80;
        server_name ecommerce.bratsos.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- E-commerce: HTTPS (its own cert) ----------
    server {
        listen 443 ssl http2;
        server_name ecommerce.bratsos.online;

        ssl_certificate     /etc/letsencrypt/live/ecommerce.bratsos.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ecommerce.bratsos.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 25M;

        location /api/ {
            proxy_pass http://ecommerce_backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://ecommerce_backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /crops/ {
            proxy_pass http://ecommerce_backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://ecommerce_frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
