# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name ecommerce.bratsos.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ecommerce.bratsos.online;

    ssl_certificate     /etc/letsencrypt/live/bratsos.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bratsos.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://ecommerce-backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
